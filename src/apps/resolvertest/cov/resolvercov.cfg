FEATURES {
    STARTADDRESS: default = $4000;
}
SYMBOLS {
    __LOADADDR__: type = import;
    __JMPTBLSIZE__: type = weak, value = $1e;
}
# The overlay's own config (cfg-mega65.cfg in src/overlays/resolverasm), but
# MAIN ends at $9000, where asmlib starts. The instrumented overlay is much
# bigger than the real one, so it must not be allowed to reach asmlib.
MEMORY {
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    JMPS:     file = %O, start = %S,     size = __JMPTBLSIZE__;
    MAIN:     file = %O, start = %S + __JMPTBLSIZE__,
              size = $5000 - __JMPTBLSIZE__;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    JMPTBL:   load = JMPS,     type = ro;
    CODE:     load = MAIN,     type = rw;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw,  optional = yes;
    BSS:      load = MAIN,     type = bss, optional = yes, define = yes;
}
